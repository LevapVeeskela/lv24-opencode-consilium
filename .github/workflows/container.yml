name: container

# Publishes the consilium container image to GitHub Container Registry.
# Manual only: `gh workflow run container.yml --ref master -f version=1.4.1`.
# Public GHCR packages have free storage and bandwidth; the account's Packages
# budget is $0 with usage blocked. The image is linux/amd64 + linux/arm64.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 1.4.1"
        required: true
        default: "1.7.0"

permissions:
  contents: read

concurrency:
  group: container-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/levapveeskela/lv24-opencode-consilium
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest

      - name: Build metadata
        id: build
        run: |
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}

      # New GHCR packages are private by default. The workflow token can
      # sometimes change user package visibility; if it cannot, the owner
      # toggles it once in the package settings (the check below reports it).
      - name: Make the package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh api --method PATCH "/users/${OWNER}/packages/container/lv24-opencode-consilium" \
            -f visibility=public \
            || echo "::warning::Set package visibility to public in GitHub Packages settings."

      - name: Verify anonymous pull
        continue-on-error: true
        env:
          VERSION: ${{ inputs.version }}
        run: |
          docker logout ghcr.io >/dev/null 2>&1 || true
          if docker pull "ghcr.io/levapveeskela/lv24-opencode-consilium:${VERSION}" >/dev/null 2>&1; then
            echo "::notice::ghcr.io/levapveeskela/lv24-opencode-consilium:${VERSION} is publicly pullable"
          else
            echo "::warning::The image is published but not public yet. Open the package settings and set visibility to public."
          fi
